services:
  frontend:
    image: ${DOCKERHUB_USERNAME}/blog-frontend:${IMAGE_TAG:-latest}
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: ${DOCKERHUB_USERNAME}/blog-backend:${IMAGE_TAG:-latest}
    environment:
      DB_HOST: ${DB_HOST}
      DB_NAME: blogdb
      DB_USER: bloguser
      DB_PASSWORD: ${DB_PASSWORD}
      PORT: "5000"
    expose:
      - "5000"
    restart: unless-stopped
